<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 登录</title>
    <link rel="stylesheet" href="/admin/styles.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>管理后台</h2>
                <p>请登录以继续</p>
            </div>

            <!-- Error Alert -->
            <div id="errorAlert" class="alert alert-danger" role="alert">
                <strong>登录失败：</strong>
                <span id="errorMessage"></span>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="username" class="form-label">用户名</label>
                    <input type="text" class="form-control" id="username" name="username" 
                           placeholder="请输入用户名" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">密码</label>
                    <input type="password" class="form-control" id="password" name="password" 
                           placeholder="请输入密码" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-login" id="loginButton">
                    <span id="loginButtonText">登录</span>
                    <span id="loginButtonSpinner" class="spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                </button>
            </form>
        </div>
    </div>

    <script>
        // Check if already logged in
        (function checkAuth() {
            const token = localStorage.getItem('admin_token');
            const expiresAt = localStorage.getItem('admin_token_expires_at');
            
            if (token && expiresAt) {
                const now = new Date().getTime();
                const expiry = new Date(expiresAt).getTime();
                
                // If token exists and not expired, redirect to dashboard
                if (now < expiry) {
                    window.location.href = '/admin/dashboard.html';
                } else {
                    // Clear expired token
                    localStorage.removeItem('admin_token');
                    localStorage.removeItem('admin_token_expires_at');
                }
            }
        })();

        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');
            const errorMessage = document.getElementById('errorMessage');
            const loginButton = document.getElementById('loginButton');
            const loginButtonText = document.getElementById('loginButtonText');
            const loginButtonSpinner = document.getElementById('loginButtonSpinner');
            
            // Hide previous errors
            errorAlert.classList.remove('show');
            
            // Validate inputs
            if (!username || !password) {
                showError('请输入用户名和密码');
                return;
            }
            
            // Disable button and show loading
            loginButton.disabled = true;
            loginButtonText.classList.add('d-none');
            loginButtonSpinner.classList.remove('d-none');
            
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    // Store token and expiry in localStorage
                    localStorage.setItem('admin_token', data.data.token);
                    localStorage.setItem('admin_token_expires_at', data.data.expires_at);
                    
                    // Redirect to dashboard
                    window.location.href = '/admin/dashboard.html';
                } else {
                    // Show error message
                    const message = data.error?.message || '登录失败，请检查用户名和密码';
                    showError(message);
                    
                    // Re-enable button
                    loginButton.disabled = false;
                    loginButtonText.classList.remove('d-none');
                    loginButtonSpinner.classList.add('d-none');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('网络错误，请稍后重试');
                
                // Re-enable button
                loginButton.disabled = false;
                loginButtonText.classList.remove('d-none');
                loginButtonSpinner.classList.add('d-none');
            }
        });
        
        function showError(message) {
            const errorAlert = document.getElementById('errorAlert');
            const errorMessage = document.getElementById('errorMessage');
            
            errorMessage.textContent = message;
            errorAlert.classList.add('show');
        }
    </script>
</body>
</html>
